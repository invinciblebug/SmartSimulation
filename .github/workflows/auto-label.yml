name: Auto Label Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue based on content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const labels = new Set();

            // Add labels based on title
            if (title.includes('[BUG]')) {
              labels.add('bug');
            }
            if (title.includes('[FEATURE]')) {
              labels.add('enhancement');
            }

            // Add labels based on body content
            const bodyLower = body.toLowerCase();

            // Bug type labels
            if (bodyLower.includes('game crash') || bodyLower.includes('freeze')) {
              labels.add('crash');
            }
            if (bodyLower.includes('sims standing still') || bodyLower.includes('not performing actions')) {
              labels.add('stall');
            }
            if (bodyLower.includes('timeline stuck') || bodyLower.includes('simulation frozen')) {
              labels.add('timeline');
            }
            if (bodyLower.includes('loading screen') || bodyLower.includes('slow loading')) {
              labels.add('loading');
            }
            if (bodyLower.includes('routing failure') || bodyLower.includes('stuck pathfinding')) {
              labels.add('routing');
            }
            if (bodyLower.includes('mod not loading') || bodyLower.includes('script error')) {
              labels.add('mod-loading');
            }
            if (bodyLower.includes('compatibility issue')) {
              labels.add('compatibility');
            }
            if (bodyLower.includes('performance slowdown')) {
              labels.add('performance');
            }

            // OS labels
            if (bodyLower.includes('windows 10') || bodyLower.includes('windows 11')) {
              labels.add('os:windows');
            }
            if (bodyLower.includes('macos') || bodyLower.includes('mac os')) {
              labels.add('os:macos');
            }
            if (bodyLower.includes('linux') || bodyLower.includes('steam/proton') || bodyLower.includes('lutris')) {
              labels.add('os:linux');
            }

            // Severity labels
            if (bodyLower.includes('critical')) {
              labels.add('severity:critical');
            }
            if (bodyLower.includes('high')) {
              labels.add('severity:high');
            }
            if (bodyLower.includes('medium')) {
              labels.add('severity:medium');
            }
            if (bodyLower.includes('low')) {
              labels.add('severity:low');
            }

            // Version labels
            const versionMatch = body.match(/Smart Simulation Version[:\s]*(\d+\.\d+\.\d+)/i);
            if (versionMatch) {
              labels.add(`version:v${versionMatch[1]}`);
            }

            // Add labels
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: Array.from(labels)
              });
              console.log(`Added labels: ${Array.from(labels).join(', ')}`);
            }
