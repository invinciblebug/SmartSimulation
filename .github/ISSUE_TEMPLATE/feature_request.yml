---
name: Feature Request
description: Suggest a new feature or improvement for Smart Simulation mod
title: '[FEATURE] '
labels: ['enhancement']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!

        For more information about Smart Simulation, visit: https://invinciblebug.github.io

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see added
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be useful? What problem does it solve?
      placeholder: Explain why this feature is needed...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working
      placeholder: Describe how the feature should work...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternative solutions or features you've considered
      placeholder: Describe alternative approaches...
    validations:
      required: false

  - type: textarea
    id: system-info
    attributes:
      label: System Information (system_info.json)
      description: |
        Please paste the contents of your `system_info.json` file from the [INVINCIBLEBUG] folder.
        This helps us understand your system configuration for the feature.

        **Location:**
        - Windows: `C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\[INVINCIBLEBUG]\system_info.json`
        - macOS: `/Users/<Username>/Documents/Electronic Arts/The Sims 4/[INVINCIBLEBUG]/system_info.json`
        - Linux: `~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/[INVINCIBLEBUG]/system_info.json`

        Open the file with a text editor and paste the contents here.
    validations:
      required: false

  - type: textarea
    id: game-config-files
    attributes:
      label: Game Configuration Files (Optional)
      description: |
        Please paste the contents of these Sims 4 game configuration files if relevant to the feature.

        **Location:**
        - Windows: `C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\`
        - macOS: `/Users/<Username>/Documents/Electronic Arts/The Sims 4/`
        - Linux: `~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/`

        **Paste contents of any that exist:**
        - `GameConfig.ini` (game configuration settings)
        - `Options.ini` (game options)
        - `OptionsClient.ini` (client options)
      placeholder: Paste the contents of game config files here...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Mod Log Files (Optional)
      description: |
        If the feature relates to a specific issue, please paste your mod log files.

        **Location:**
        - Windows: `C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\[INVINCIBLEBUG]\`
        - macOS: `/Users/<Username>/Documents/Electronic Arts/The Sims 4/[INVINCIBLEBUG]/`
        - Linux: `~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/[INVINCIBLEBUG]/`

        **Paste contents of:**
        - `SmartSimulation_YYYYMMDD_HHMMSS.log` (main log)
        - `SmartSimulation_SimActivity_YYYYMMDD_HHMMSS.log` (sim activity log)
      placeholder: Paste the contents of mod log files here...
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: |
        List any other mods you have installed, especially:
        - Better Exceptions
        - UI Cheats Extension
        - MCCC
        - Other performance mods
      placeholder: |
        Example:
        - Better Exceptions v2024.1.2
        - MCCC v1270
        - UI Cheats Extension v1.1.6
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples about the feature request
      placeholder: Add any additional information...
    validations:
      required: false
