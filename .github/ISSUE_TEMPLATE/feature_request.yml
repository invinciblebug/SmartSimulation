---
name: Feature Request
description: Suggest a new feature or improvement for Smart Simulation mod
title: '[FEATURE] '
labels: ['enhancement']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Thanks for suggesting a new feature!

        For more information about Smart Simulation, visit: https://invinciblebug.github.io

  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      description: What type of feature are you requesting?
      options:
        - Performance optimization
        - Stall recovery improvement
        - Loading screen enhancement
        - Routing detection
        - Error logging / diagnostics
        - Configuration options
        - Cheat commands
        - Compatibility improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see added
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be useful? What problem does it solve?
      placeholder: Explain why this feature is needed...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working
      placeholder: Describe how the feature should work...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternative solutions or features you've considered
      placeholder: Describe alternative approaches...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve experience
        - High - Important for my gameplay
        - Critical - Essential for mod functionality
    validations:
      required: false

  - type: dropdown
    id: affected-version
    attributes:
      label: Smart Simulation Version
      description: Which version are you using?
      options:
        - 1.0.0
        - Other (specify in additional context)
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: |
        List any other mods you have installed that might be relevant:
        - Better Exceptions
        - MCCC
        - Other performance mods
      placeholder: |
        Example:
        - Better Exceptions v2024.1.2
        - MCCC v1270
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples about the feature request
      placeholder: Add any additional information...
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        
        **Thank you for your suggestion!**

        Your feedback helps improve Smart Simulation for everyone. I'll review your request and respond as soon as possible.

        For discussions about features, you can also start a discussion at:
        https://github.com/invinciblebug/SmartSimulation/discussions
