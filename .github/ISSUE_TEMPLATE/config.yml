blank_issues_enabled: true
contact_links:
  - name: GitHub Discussions
    url: https://github.com/invinciblebug/SmartSimulation/discussions
    about: Use GitHub Discussions for questions, help, and general conversation
  - name: Bug Report
    url: https://github.com/invinciblebug/SmartSimulation/issues/new?template=bug_report.yml
    about: Report a bug or issue with the mod
  - name: Feature Request
    url: https://github.com/invinciblebug/SmartSimulation/issues/new?template=feature_request.yml
    about: Suggest a new feature or improvement

  - name: System Information Files
    url: https://github.com/invinciblebug/SmartSimulation/wiki/System-Information
    about: |
      When reporting issues, please include these files from your [INVINCIBLEBUG] folder:
      
      Required:
      - system_info.json (system details, mod version, Core Library version)
      - SmartSimulation_YYYYMMDD_HHMMSS.log (main log)
      - SmartSimulation_SimActivity_YYYYMMDD_HHMMSS.log (sim activity log)
      
      Optional (for game settings related issues):
      - GameConfig.ini
      - Options.ini
      - OptionsClient.ini
      - lastException.txt

  - name: Game Configuration Files
    url: https://github.com/invinciblebug/SmartSimulation/wiki/Game-Configuration
    about: |
      Sims 4 game configuration files location:
      
      Windows: C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\
      macOS: /Users/<Username>/Documents/Electronic Arts/The Sims 4/
      Linux: ~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/
      
      Files to include:
      - GameConfig.ini
      - Options.ini
      - OptionsClient.ini
      - config.log
      - lastException.txt

  - name: Better Exceptions Compatibility
    url: https://github.com/invinciblebug/SmartSimulation/discussions
    about: |
      If you are using Better Exceptions mod, please check if it shows any errors
      related to Smart Simulation. Include the error message in your bug report.
