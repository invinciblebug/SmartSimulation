---
name: Bug Report
description: Report a bug or issue with Smart Simulation mod
title: '[BUG] '
labels: ['bug']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        For more information about Smart Simulation, visit: https://invinciblebug.github.io

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: error-message
    attributes:
      label: Error Message / Exception
      description: |
        What error or exception did you see? Please paste the exact error message.
        If you were using Better Exceptions mod, did it show any errors related to Smart Simulation?
      placeholder: |
        Paste the exact error message here.
        
        If using Better Exceptions:
        - Did Better Exceptions show any errors for Smart Simulation?
        - What did the error say?
        - Copy the full error from Better Exceptions window.
    validations:
      required: true

  - type: textarea
    id: steps-to-reroduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start the game
        2. Load a household
        3. Do '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Mod Log Files
      description: |
        Please paste the contents of your mod log files from the [INVINCIBLEBUG] folder.
        These logs contain timestamps, errors, and diagnostic information.

        **Location:**
        - Windows: `C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\[INVINCIBLEBUG]\`
        - macOS: `/Users/<Username>/Documents/Electronic Arts/The Sims 4/[INVINCIBLEBUG]/`
        - Linux: `~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/[INVINCIBLEBUG]/`

        **Paste contents of:**
        - `SmartSimulation_Month DD, YYYY.log` (main log)
        - `SmartSimulation_SimActivity_Month DD, YYYY.log` (sim activity log)
    validations:
      required: true

  - type: textarea
    id: last-exception
    attributes:
      label: lastException.txt
      description: |
        Please paste the contents of `lastException.txt` from your Sims 4 folder.
        This contains the full stack trace of any errors.

        **Location:**
        - Windows: `C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\lastException.txt`
        - macOS: `/Users/<Username>/Documents/Electronic Arts/The Sims 4/lastException.txt`
        - Linux: `~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/lastException.txt`
      placeholder: Paste the contents of lastException.txt here...
    validations:
      required: false

  - type: textarea
    id: game-config-files
    attributes:
      label: Game Configuration Files
      description: |
        Please paste the contents of these Sims 4 game configuration files.
        These help diagnose game settings related issues.

        **Location:**
        - Windows: `C:\Users\<Username>\Documents\Electronic Arts\The Sims 4\`
        - macOS: `/Users/<Username>/Documents/Electronic Arts/The Sims 4/`
        - Linux: `~/.local/share/Steam/steamapps/compatdata/1222670/pfx/drive_c/users/steamuser/Documents/Electronic Arts/The Sims 4/`

        **Paste contents of any that exist:**
        - `GameConfig.ini` (game configuration settings)
        - `Options.ini` (game options)
        - `OptionsClient.ini` (client options)
        - `config.log` (game configuration log)
        - `ConnectionStatus.txt` (connection status information)
      placeholder: Paste the contents of game config files here...
    validations:
      required: false

  - type: textarea
    id: better-exceptions
    attributes:
      label: Better Exceptions Errors
      description: |
        If you are using Better Exceptions mod, did it show any errors for Smart Simulation?
        Paste any error messages from Better Exceptions here.
      placeholder: |
        Paste Better Exceptions errors here (if any)...
        
        If no errors, leave blank.
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: |
        List any other mods you have installed, especially:
        - Better Exceptions
        - UI Cheats Extension
        - MCCC
        - Other performance mods
        - Any script mods (.ts4script files)
      placeholder: |
        Example:
        - Better Exceptions v2024.1.2
        - MCCC v1270
        - UI Cheats Extension v1.1.6
        - Lot51 Core Library v1.43
    validations:
      required: false

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux (Steam/Proton)
        - Linux (Lutris/EA App)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: e.g., Windows 11, macOS Sonoma, Ubuntu 22.04
      placeholder: Enter your OS version
    validations:
      required: false

  - type: input
    id: smart-sim-version
    attributes:
      label: Smart Simulation Version
      description: Check the mod filename for version (e.g., v1.0.0)
      placeholder: e.g., 1.0.0
    validations:
      required: true

  - type: input
    id: sims4-version
    attributes:
      label: Sims 4 Version
      description: Check in Game Options > About or Config.log
      placeholder: e.g., 1.126.73.1030
    validations:
      required: true

  - type: input
    id: core-library-version
    attributes:
      label: Core Library Version
      description: Check Config.log for Core Library version
      placeholder: e.g., 1.43
    validations:
      required: false

  - type: dropdown
    id: game-language
    attributes:
      label: Game Language
      description: What language is your game set to?
      options:
        - English
        - German
        - French
        - Spanish
        - Italian
        - Portuguese
        - Russian
        - Polish
        - Other
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical - Game crashes or completely unplayable
        - High - Major feature broken, but game playable
        - Medium - Minor feature broken or workaround available
        - Low - Cosmetic issue or minor inconvenience
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: |
        When did the issue start?
        Does it happen consistently?
        What were you doing when it occurred?
        Did the issue start after installing/updating a mod?
    validations:
      required: false
